name: Publish approved Astro site
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Full reviewed commit SHA currently on new-personal-blog main'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: pages-production
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: reynoldsalec/new-personal-blog
          ref: main
          persist-credentials: false
      - name: Require exact reviewed source
        env:
          EXPECTED_SHA: ${{ inputs.source_sha }}
        run: |
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
      - run: npm ci
      - run: npm run check && npm run build && npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Audit (allow GHSA-fc5q-39xc-vjpf, see new-personal-blog#2)
        run: |
          npm audit --json > audit.json || true
          jq -e '[.vulnerabilities[].via[] | objects
                  | select(.severity=="high" or .severity=="critical") | .url]
                 | unique
                 | map(select(endswith("GHSA-fc5q-39xc-vjpf") | not))
                 | length == 0' audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: browser-evidence
          path: artifacts
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
